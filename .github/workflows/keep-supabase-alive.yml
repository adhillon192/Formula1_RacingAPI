# Last edited: 2025-12-04
name: Keep Supabase Alive

on:
  schedule:
    # Every 4 days at midnight UTC
    - cron: "0 0 */4 * *"
  workflow_dispatch: # allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API via Supabase Edge Function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          API_URL: ${{ secrets.API_URL }}
        run: |
          echo "Calling Supabase Edge Function to keep API alive..."
          EDGE_FUNCTION_URL="${SUPABASE_URL}/functions/v1/keep-alive"
          
          response=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            "$EDGE_FUNCTION_URL")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "Response: $body"
          echo "HTTP Status Code: $http_code"
          
          if [ "$http_code" -eq 200 ]; then
            echo "✓ API keep-alive completed successfully via Supabase Edge Function"
          else
            echo "✗ Edge function call failed with status code: $http_code"
            exit 1
          fi
